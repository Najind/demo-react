name: Deploy React App

on:
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun i

      - name: Lint
        run: bun run lint

  deploy:
    runs-on: ubuntu-latest
    needs: lint   # รัน deploy ได้ก็ต่อเมื่อ lint ผ่าน
    steps:
      - name: Clone repo
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun i

      - name: Build
        run: bun run build

      - name: List dist/
        run: ls dist

      - name: Deploy to GitHub Pages
        run: echo "Deploying to GitHub Pages..."
